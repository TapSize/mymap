<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Розрахунок ОДК 7 Прикз — Маршрут моніторингу</title>
<style>
  :root { --bg:#0a1224; --grid:#0e1a36; --card:#0f1b34; --ink:#e5e7eb; --muted:#94a3b8; --accent:#22d3ee; --bad:#ef4444; --good:#22c55e; --warn:#f59e0b; --route:#60a5fa; }
  html,body{margin:0;padding:0;background:
    linear-gradient(180deg, rgba(96,165,250,0.05), rgba(34,211,238,0.04)) fixed,
    radial-gradient(1200px 600px at 80% -10%, rgba(34,211,238,0.12), transparent 60%) fixed,
    radial-gradient(1000px 700px at -10% 110%, rgba(96,165,250,0.12), transparent 60%) fixed,
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 40px),
    var(--bg);
    color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  h1{font-size:1.6rem;margin:1rem 0;text-align:center;letter-spacing:0.3px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0));border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,0.25)}

  /* Tabs */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{cursor:pointer;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:#0b162e;color:#cbd5e1;font-weight:600}
  .tab.active{background:var(--accent);color:#03212a;border-color:transparent}
  .hidden{display:none}

  .grid-4,.grid-3,.grid-2{display:grid;gap:12px}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}

  .box{display:flex;flex-direction:column;gap:6px;background:#0b162e;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px;}
  .box label{font-size:0.85rem;color:var(--muted)}
  .box input,.box select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0b162e;color:var(--ink);outline:none;font-size:0.9rem;max-width:170px;}
  .box input:focus,.box select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(34,211,238,0.25)}

  .btn{cursor:pointer;background:var(--accent);color:#03212a;border:none;border-radius:10px;padding:10px 14px;font-weight:700;width:100%;font-size:1rem}
  .btn:active{transform:translateY(1px)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}

  .pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#0b162e;border:1px solid rgba(255,255,255,0.08);font-size:0.8rem;color:var(--muted);margin-right:6px;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border-bottom:1px solid rgba(255,255,255,0.08);padding:8px;text-align:left;font-variant-numeric:tabular-nums;font-size:0.88rem}
  th{color:#cbd5e1}
  .right{text-align:right}
  .ok{color:var(--good)}
  .bad{color:var(--bad)}
  .warn{color:var(--warn)}
  .section-title{font-weight:700;color:#a5b4fc;margin-bottom:8px;font-size:1.1rem}
  .error-banner{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.5);padding:10px;border-radius:10px;margin-bottom:10px}
  .success-banner{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.5);padding:10px;border-radius:10px;margin-bottom:10px}

  /* Ланцюжок маршруту */
  .route{display:flex;gap:8px;align-items:center;overflow:auto;padding:10px;border:1px dashed rgba(255,255,255,0.15);border-radius:12px;background:linear-gradient(180deg,rgba(96,165,250,0.05),rgba(34,211,238,0.05))}
  .node{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:160px;background:#0a1a33;border:1px solid rgba(96,165,250,0.35);border-radius:10px;padding:10px}
  .node .title{font-weight:700;color:#bfdbfe;font-size:0.92rem}
  .node .meta{font-size:0.8rem;color:#93c5fd}
  .arrow{flex:0 0 auto}
  .arrow::after{content:'→';color:var(--route);font-weight:800;font-size:1.1rem}

  .row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .remove{background:#13213f;border:1px solid rgba(255,255,255,0.15);color:#cbd5e1;border-radius:8px;padding:6px 8px;cursor:pointer}
</style>
</head>
<body>

<script>
'use strict';
const KTS2KMPH = 1.852;
function fmt(n,d=1){ return isFinite(n) ? Number(n).toFixed(d) : '—'; }
function kg(v){ return `${fmt(v,1)} кг`; }
function km(v){ return `${fmt(v,1)} км`; }
function kts(v){ return `${fmt(v,0)} вузл`; }
function hrs(v){
  if(!isFinite(v)) return '—';
  const totalSec = Math.round(v * 3600);
  const hh = Math.floor(totalSec / 3600);
  const mm = Math.floor((totalSec % 3600) / 60);
  const ss = totalSec % 60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}

const DATASETS = {
  odk7: new Map([
    ['Нісмічі',    {km:56, msa:1400}],
    ['Рава-Руська',{km:22, msa:1600}],
    ['Краківець',  {km:40, msa:1500}],
    ['Шегині',     {km:31, msa:1500}],
    ['Смільниця',  {km:54, msa:3600}],
    ['Сянки',      {km:76, msa:3500}],
  ]),
  p31: new Map([
    ['Шибени',     {km:31, msa:6950}],
    ['Селятин',    {km:68, msa:6150}],
    ['Фальків',    {km:13, msa:4250}],
    ['Красноїльськ',{km:27, msa:4250}],
    ['Порубне',    {km:40, msa:2070}],
    ['Герца',      {km:23, msa:1680}],
    ['Мамалига',   {km:52, msa:1490}],
    ['Кельменці',  {km:81, msa:2250}],
    ['Сокиряни',   {km:70, msa:1880}],
  ])
};

function makeLegend(dataset, tgtId){
  const tgt = document.getElementById(tgtId);
  tgt.innerHTML = '';
  Array.from(dataset.entries()).forEach(([name, vals])=>{
    const span = document.createElement('span');
    span.className = 'pill';
    span.textContent = `${name} — ${vals.km} км — MSA ${vals.msa} ft`;
    tgt.appendChild(span);
  });
}

function addRegionRow(listId, dataset, defaultName=''){
  const wrap = document.createElement('div');
  wrap.className = 'box';

  const row = document.createElement('div');
  row.className = 'row-inline';

  const sel = document.createElement('select');
  sel.innerHTML = `<option value="">— оберіть район —</option>` +
    Array.from(dataset.keys()).map(n=>`<option value="${n}">${n}</option>`).join('');
  if(defaultName) sel.value = defaultName;

  const info = document.createElement('div');
  info.className = 'pill';
  info.textContent = '— км, MSA — ft';

  const spd = document.createElement('input'); spd.type = 'number'; spd.placeholder = 'Швидкість, вузли'; spd.step = '0.1'; spd.style.maxWidth='140px';
  const burn = document.createElement('input'); burn.type = 'number'; burn.placeholder = 'Витрата, кг/год'; burn.step = '0.1'; burn.style.maxWidth='140px';

  const del = document.createElement('button'); del.className='remove'; del.textContent='Прибрати';

  sel.addEventListener('change', ()=>{
    const name = sel.value;
    if(dataset.has(name)){
      const {km:kmv, msa} = dataset.get(name);
      info.textContent = `${km(kmv)} • MSA ${msa} ft`;
    } else {
      info.textContent = '— км, MSA — ft';
    }
  });

  del.addEventListener('click', ()=> wrap.remove());

  row.append(sel, info, spd, burn, del);
  wrap.append(row);
  document.getElementById(listId).append(wrap);
  sel.dispatchEvent(new Event('change'));
}

function readNumber(el){
  if(!el) return NaN;
  const raw = (el.value||'').toString().replace(',','.');
  const v = parseFloat(raw);
  return isFinite(v) ? v : NaN;
}

function calcSeg(distKm, spdKts, burnKgH){
  if(!(distKm>0) || !(spdKts>0) || !(burnKgH>0)) return {timeH:NaN, fuelKg:NaN};
  const timeH = distKm / (spdKts * 1.852);
  const fuelKg = timeH * burnKgH;
  return {timeH, fuelKg};
}

function collectRegions(listId, dataset){
  const out = [];
  document.querySelectorAll(`#${listId} .box`).forEach((box, idx)=>{
    const sel = box.querySelector('select');
    const spd = box.querySelector('input[placeholder^="Швидкість"]');
    const burn= box.querySelector('input[placeholder^="Витрата"]');
    const name = sel.value;
    if(name && dataset.has(name)){
      const def = dataset.get(name);
      out.push({ order: idx+1, name, km:def.km, msa:def.msa, spd:readNumber(spd), burn:readNumber(burn) });
    }
  });
  return out;
}

function renderChain(nodes, chainWrapId, chainId){
  const wrap = document.getElementById(chainWrapId);
  const cont = document.getElementById(chainId);
  cont.innerHTML = '';
  if(!nodes || !nodes.length){ wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  nodes.forEach((n,i)=>{
    const box = document.createElement('div');
    box.className = 'node';
    box.innerHTML = `<div class='title'>${n.title}</div><div class='meta'>${n.meta||''}</div>`;
    cont.appendChild(box);
    if(i<nodes.length-1){ const a = document.createElement('span'); a.className = 'arrow'; cont.appendChild(a); }
  });
}

function computeGeneric(prefix, dataset){
  const emgReserve = readNumber(document.getElementById(`emgReserve_${prefix}`));
  const startName = (document.getElementById(`startName_${prefix}`).value||'Старт').trim();
  const endName   = (document.getElementById(`endName_${prefix}`).value||'База').trim();
  const fuelStart = readNumber(document.getElementById(`fuelStart_${prefix}`));
  const burnTransit = readNumber(document.getElementById(`burnTransit_${prefix}`));
  const distOut = readNumber(document.getElementById(`distOutKm_${prefix}`));
  const spdOut  = readNumber(document.getElementById(`spdOutKts_${prefix}`));
  const distBack= readNumber(document.getElementById(`distBackKm_${prefix}`));
  const spdBack = readNumber(document.getElementById(`spdBackKts_${prefix}`));

  const regs = collectRegions(`regionsList_${prefix}`, dataset);
  const errs = [];
  if(!(fuelStart>0)) errs.push('Вкажіть початкову заправку (кг)');
  if(!(burnTransit>0)) errs.push('Вкажіть витрату пального по маршруту (кг/год)');
  if(!(emgReserve>=0)) errs.push('Вкажіть аварійний залишок (кг)');
  if(!(distOut>=0)) errs.push('Вкажіть відстань до початку моніторингу (км)');
  if(!(spdOut>0)) errs.push('Вкажіть швидкість до початку моніторингу (вузли)');
  if(!(distBack>=0)) errs.push('Вкажіть відстань від кінця моніторингу до посадки (км)');
  if(!(spdBack>0)) errs.push('Вкажіть швидкість на зворотному маршруті (вузли)');
  if(regs.length===0) errs.push('Додайте хоча б один район');
  regs.forEach(r=>{ if(!(r.spd>0)) errs.push(`Район ${r.name}: вкажіть швидкість (вузли)`); if(!(r.burn>0)) errs.push(`Район ${r.name}: вкажіть витрату (кг/год)`); });

  document.getElementById(`results_${prefix}`).style.display='block';

  if(errs.length){
    document.getElementById(`banner_${prefix}`).innerHTML = `<div class='error-banner'>${errs.join('<br>')}</div>`;
    document.getElementById(`table_${prefix}`).innerHTML='';
    document.getElementById(`summary_${prefix}`).innerHTML='';
    document.getElementById(`chainWrap_${prefix}`).style.display='none';
    return;
  }

  // Ланцюжок: показати кілометраж від старту до першого району
  const chain = [];
  chain.push({title:startName, meta:`Паливо: ${kg(fuelStart)}`});

  // Транзит до першого району
  const outSeg = calcSeg(distOut, spdOut, burnTransit);
  let usedFuel = outSeg.fuelKg;
  let usedTime = outSeg.timeH;
  let totalKm  = distOut;

  // Додаємо у ланцюжок перший район і мету показуємо кілометраж/час/паливо саме цього транзиту
  const firstRegionName = regs[0]?.name || 'Перший район';
  chain.push({ title: firstRegionName, meta: `${km(distOut)} / ${hrs(outSeg.timeH)} / витрата ${kg(outSeg.fuelKg)}` });

  const rows = [["Етап","Відстань","Швидкість","Час","Витрачено пального","Залишок"]];
  // Рядок з підписом: "Старт - Перший район"
  rows.push([`${startName} - ${firstRegionName}`, km(distOut), kts(spdOut), hrs(outSeg.timeH), kg(outSeg.fuelKg), kg(fuelStart - usedFuel)]);

  // Райони
  regs.forEach(r=>{
    const seg = calcSeg(r.km, r.spd, r.burn);
    usedFuel += seg.fuelKg; usedTime += seg.timeH; totalKm += r.km;
    const rem = fuelStart - usedFuel;
    rows.push([`${r.name} (MSA ${r.msa} ft)`, km(r.km), kts(r.spd), hrs(seg.timeH), kg(seg.fuelKg), kg(rem)]);
    chain.push({title:r.name, meta:`${km(r.km)} / ${hrs(seg.timeH)} / залишок ${kg(rem)}`});
  });

  // Транзит назад — підпис: "Останній район - Точка посадки"
  const lastRegionName = regs[regs.length-1]?.name || 'Крайня точка';
  const backSeg = calcSeg(distBack, spdBack, burnTransit);
  totalKm += distBack;
  const totalFuel = usedFuel + backSeg.fuelKg;
  const totalTime = usedTime + backSeg.timeH;
  const remain = fuelStart - totalFuel;
  rows.push([`${lastRegionName} - ${endName}`, km(distBack), kts(spdBack), hrs(backSeg.timeH), kg(backSeg.fuelKg), kg(remain)]);
  chain.push({title:endName, meta:`${km(distBack)} / ${hrs(backSeg.timeH)} / при посадці ${kg(remain)}`});

  // Вивід
  renderChain(chain, `chainWrap_${prefix}`, `routeChain_${prefix}`);
  document.getElementById(`banner_${prefix}`).innerHTML = `<div class='success-banner'>Маршрут розраховано</div>`;
  document.getElementById(`table_${prefix}`).innerHTML = rows.map((r,i)=>`<tr>${r.map((c,j)=> i===0?`<th>${c}</th>`:`<td class='${j>=3?'right':''}'>${c}</td>`).join('')}</tr>`).join('');
  document.getElementById(`summary_${prefix}`).innerHTML = `
    <div class='pill'>Загальна відстань: <b>${km(totalKm)}</b></div>
    <div class='pill'>Загальний час польоту: <b>${hrs(totalTime)}</b></div>
    <div class='pill'>Аварійний залишок: <b>${kg(emgReserve)}</b></div>
    <div class='pill'>Залишок на базі: <b class='${remain>emgReserve?'ok':'bad'}'>${kg(remain)}</b></div>`;
}

function setupTab(prefix, dataset){
  // Legend
  makeLegend(dataset, `legend_${prefix}`);

  // Add button
  document.getElementById(`addBtn_${prefix}`).addEventListener('click', ()=> addRegionRow(`regionsList_${prefix}`, dataset));

  // Calc
  document.getElementById(`calcBtn_${prefix}`).addEventListener('click', ()=> computeGeneric(prefix, dataset));

  // Demo
  document.getElementById(`demo1_${prefix}`).addEventListener('click', ()=>{
    document.getElementById(`startName_${prefix}`).value = 'ЛЬВІВ';
    document.getElementById(`endName_${prefix}`).value   = 'ЛЬВІВ';
    document.getElementById(`fuelStart_${prefix}`).value = 427;
    document.getElementById(`burnTransit_${prefix}`).value = 140;
    document.getElementById(`distOutKm_${prefix}`).value = 40;
    document.getElementById(`spdOutKts_${prefix}`).value = 120;
    document.getElementById(`distBackKm_${prefix}`).value = 35;
    document.getElementById(`spdBackKts_${prefix}`).value = 115;
    document.getElementById(`regionsList_${prefix}`).innerHTML='';
    // add 3 rows
    const keys = Array.from(dataset.keys());
    addRegionRow(`regionsList_${prefix}`, dataset, keys[0]||'');
    addRegionRow(`regionsList_${prefix}`, dataset, keys[1]||'');
    addRegionRow(`regionsList_${prefix}`, dataset, keys[2]||'');
    const rows = document.querySelectorAll(`#regionsList_${prefix} .box`);
    if(rows[0]){ rows[0].querySelector('input[placeholder^="Швидкість"]').value = 80; rows[0].querySelector('input[placeholder^="Витрата"]').value = 125; }
    if(rows[1]){ rows[1].querySelector('input[placeholder^="Швидкість"]').value = 78; rows[1].querySelector('input[placeholder^="Витрата"]').value = 120; }
    if(rows[2]){ rows[2].querySelector('input[placeholder^="Швидкість"]').value = 82; rows[2].querySelector('input[placeholder^="Витрата"]').value = 128; }
    computeGeneric(prefix, dataset);
  });
}

// Tabs switch
const titleElement = document.querySelector('h1');
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
    // Change page title dynamically
    if(btn.dataset.tab === 'tab-odk7'){
      titleElement.textContent = 'Розрахунок ОДК 7 Прикз';
    } else if(btn.dataset.tab === 'tab-31'){
      titleElement.textContent = 'Розрахунок 31 Прикз';
    }
  });
});

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
  });
});

setupTab('odk7', DATASETS.odk7);
setupTab('31', DATASETS.p31);
