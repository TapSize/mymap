label>\u003clabel>Швидкість\u003cinput id=\"windSpeed\" type=\"number\" min=\"0\" max=\"500\" step=\"any\" value=\"0\"/>\u003c/label>\u003cselect id=\"windUnit\" aria-label=\"Одиниці швидкості вітру\">\u003coption value=\"kmh\" selected>км/год\u003c/option>\u003coption value=\"kt\">KT\u003c/option>\u003coption value=\"ms\">м/с\u003c/option>\u003c/select>\u003cspan id=\"windHint\">\u003c/span>\u003c/div>\u003c/section>\u003cp id=\"profileWarning\" role=\"status\">\u003c/p>\n\u003csection class=\"sheet\">\u003cdiv class=\"sheetbar\">\u003cspan>ЛІВЕ КОЛО · ЗА РАДІОМАЯКОМ\u003c/span>\u003cspan>НАВІГАЦІЯ · ВИСОТИ · ЧАС\u003c/span>\u003c/div>\u003cdiv class=\"scroll\">\n\u003csvg id=\"diagram\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 980\" aria-labelledby=\"svgTitle svgDesc\">\n\u003ctitle id=\"svgTitle\">Інтерактивна схема лівого кола\u003c/title>\u003cdesc id=\"svgDesc\">Схема кола. КУР за заданими формулами, висоти, час і редаговані параметри ділянок.\u003c/desc>\n\u003cdefs>\u003cpattern id=\"grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M40 0H0V40\" fill=\"none\" stroke=\"#eef3f6\" stroke-width=\".7\"/>\u003c/pattern>\u003cmarker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0 0L6 3L0 6\" fill=\"none\" stroke=\"#315e75\" stroke-width=\"1.5\"/>\u003c/marker>\u003cfilter id=\"heliShadow\" x=\"-80%\" y=\"-80%\" width=\"260%\" height=\"260%\">\u003cfeDropShadow dx=\"0\" dy=\"3\" stdDeviation=\"3\" flood-color=\"#183f55\" flood-opacity=\".15\"/>\u003c/filter>\u003cmarker id=\"dimensionArrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto-start-reverse\">\u003cpath d=\"M7 3.5L0 0V7Z\" fill=\"#658798\"/>\u003c/marker>\u003cg id=\"helicopter\">\n\u003ccircle r=\"32\" fill=\"white\" stroke=\"#d5e3ea\" stroke-width=\"1\"/>\n\u003ccircle r=\"25\" fill=\"none\" stroke=\"#e4eef3\" stroke-width=\"1\"/>\n\u003cg stroke=\"#234e67\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n\u003cpath d=\"M-3 9L-2 27H2L3 9\" fill=\"#dde9ef\" stroke-width=\"1.6\"/>\n\u003cpath d=\"M-10 23H10M0 19V28\" fill=\"none\" stroke-width=\"1.6\"/>\n\u003cpath d=\"M-6-10C-6-23 6-23 6-10L7 6Q7 13 0 14Q-7 13-7 6Z\" fill=\"#357c9e\" stroke-width=\"1.6\"/>\n\u003cpath d=\"M-4-11Q0-20 4-11L4-6H-4Z\" fill=\"#c7edf7\" stroke=\"none\"/>\n\u003cpath d=\"M-10-7V12M10-7V12M-10 8H-6M6 8H10\" fill=\"none\" stroke-width=\"1.5\"/>\n\u003cpath d=\"M-23-4H23\" stroke=\"white\" stroke-width=\"5\"/>\n\u003cpath d=\"M-23-4H23M0-9V1\" fill=\"none\" stroke-width=\"2.4\"/>\n\u003ccircle cy=\"-4\" r=\"2.5\" fill=\"white\" stroke-width=\"1.3\"/>\n\u003c/g>\u003c/g>\u003c/defs>\n\u003cstyle>\n.card{fill:white;stroke:#cfdee6;stroke-width:1}.card-title{font-weight:600!important}.value{fill:#155a73!important}svg[data-theme=\"dark\"] .value{fill:#b8e2f2!important}.card-title{font:11px Arial,sans-serif;fill:#6f8795;letter-spacing:1.2px}.value{font:18px Consolas,monospace;fill:#183746}.small{font:12px Arial,sans-serif;fill:#6f8795}.result{font:15px Consolas,monospace;fill:#183746}.dim{stroke:#91adbc;stroke-width:1;fill:none}.connect{stroke:#b3c9d4;stroke-width:1;fill:none;stroke-dasharray:3 4}.editline{display:flex;align-items:center;gap:5px;height:29px;font:13px Arial,sans-serif;color:#6f8795;white-space:nowrap}.editline label{display:flex;align-items:center;gap:6px}.editline input{font:18px Consolas,monospace;color:#216d93;background:#f1f8fb;border:0;border-bottom:1px dashed #71a4be;border-radius:2px;width:73px;height:28px;padding:2px 4px;outline-offset:1px;box-sizing:border-box}.editline input:focus{outline:2px solid #72b1d0;background:#e7f5fc}.editline input[aria-invalid=true]{background:#fff0eb;outline:1px solid #bd5535}.editline input::-webkit-inner-spin-button{opacity:.35}.distance .editline{height:36px;padding:3px 7px;background:#fff;border:1px solid #cbdde6;border-radius:5px}.distance .editline input{width:84px}.editline input.narrow{width:55px}.e 250 260 1165 260\"/>\n\u003cpath id=\"routeLeg2\" d=\"M1165 260H700\"/>\u003cpath id=\"routeLeg3\" d=\"M700 260H435\"/>\n\u003cpath d=\"M435 260Q350 260 350 345\"/>\u003cpath id=\"routeLeg4\" d=\"M350 345V675\"/>\n\u003cpath d=\"M350 675Q350 760 435 760\"/>\u003cpath id=\"routeLeg5\" d=\"M435 760H700\"/>\n\u003cpath id=\"routeLeg6\" d=\"M700 760H950\"/>\n\u003c/g>\n\u003cg stroke=\"#90aebb\" stroke-width=\"1.4\" stroke-dasharray=\"7 7\" fill=\"none\">\u003cpath d=\"M1250 700L700 760M1230 285L700 760M700 260V760M410 265L700 760M350 690L700 760\"/>\u003c/g>\n\u003cg class=\"dim\">\u003cpath d=\"M950 830L1165 830\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M1280 345L1280 675\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M700 235L1165 235\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M435 235L700 235\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M320 345L320 675\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M435 830L700 830\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M700 830L950 830\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003c/g>\n\u003cg fill=\"none\" stroke=\"#315e75\" stroke-width=\"2\" marker-end=\"url(#arrow)\">\u003cpath d=\"M1080 760H1120M1250 590V550M1050 260H1010M350 430V470M490 760H530\"/>\u003c/g>\n\u003cg id=\"dimensions\" font-family=\"Consolas,monospace\" font-size=\"12\" fill=\"#6e8998\" text-anchor=\"middle\">\u003c/g>\n\u003cg fill=\"white\" stroke=\"#357c9e\" stroke-width=\"2\">\u003ccircle cx=\"1250\" cy=\"700\" r=\"5\"/>\u003ccircle cx=\"1230\" cy=\"285\" r=\"5\"/>\u003ccircle cx=\"700\" cy=\"260\" r=\"5\"/>\u003ccircle cx=\"410\" cy=\"265\" r=\"5\"/>\u003ccircle cx=\"350\" cy=\"690\" r=\"5\"/>\u003c/g>\n\u003cg filter=\"url(#heliShadow)\">\u003cuse href=\"#helicopter\" transform=\"translate(1100 760) rotate(90)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(1250 470)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(980 260) rotate(-90)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(350 520) rotate(180)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(565 760) rotate(90)\"/>\u003c/g>\n\u003cg font-family=\"Arial,sans-serif\">\u003crect x=\"860\" y=\"739\" width=\"180\" height=\"42\" rx=\"4\" fill=\"#29495b\"/>\u003cpath d=\"M883 760H1017\" stroke=\"white\" stroke-width=\"1.5\" stroke-dasharray=\"15 10\"/>\u003cpath d=\"M868 745V775M873 745V775M1027 745V775M1032 745V775\" stroke=\"white\" stroke-width=\"2\"/>\u003ctext x=\"950\" y=\"805\" text-anchor=\"middle\" class=\"card-title\">ЗПС\u003c/text>\n\u003cpath d=\"M700 735L680 778H720Z\" fill=\"#226c94\" stroke=\"white\" stroke-width=\"2\"/>\u003cpath d=\"M687 727Q676 714 684 703M713 727Q724 714 716 703\" fill=\"none\" stroke=\"#226c94\" stroke-width=\"2\"/>\u003ctext x=\"700\" y=\"798\" text-anchor=\"middle\" class=\"card-title\">РАДІОМАЯК\u003c/text>\u003c/g>\n\u003cg id=\"editors\">\u003c/g>\n\u003cg font-family=\"Arial,sans-serif\">\n\u003crect x=\"1300\" y=\"490\" width=\"260\" height=\"155\" rx=\"7\" class=\"card\"/>\n\u003crect x=\"1300\" y=\"490\" width=\"4\" height=\"155\" rx=\"2\" fill=\"#4389ae\"/>\n\u003ctext x=\"1316\" y=\"515\" class=\"card-title\">ЧАС КОЛА · ХВ:С\u003c/text>\n\u003ctext id=\"flightTotal\" x=\"1316\" y=\"558\" class=\"value\" style=\"font-size:36px;font-weight:600\">—\u003c/text>\n\u003ctext x=\"1316\" y=\"583\" class=\"small\">Прямі / розвороти\u003c/text>\u003ctext id=\"timeParts\" x=\"1316\" y=\"605\" class=\"result\">—\u003c/text>\n\u003ctext x=\"1316\" y=\"630\" class=\"small\">Довжина\u003c/text>\u003ctext id=\"distanceTotal\" x=\"1544\" y=\"630\" text-anchor=\"end\" class=\"result\">—\u003c/text>\n\u003ctext id=\"error\" x=\"800\" y=\"978\" text-anchor=\"middle\" fill=\"#b24932\" font-size=\"12\" role=\"status\">\u003c/text>\n\u003ctext x=\"40\" y=\"960\" class=\"small\">S — м · W/TAS — швидкість · H — висота · γ — крен · Vy — вертикальна швидкість\u003c/text>\u003ctext x=\"1560\" y=\"960\" text-anchor=\"end\" class=\"small\">НАВЧАЛЬНА СХЕМА · БЕЗ МАСШТАБУ\u003c/text>\u003c/g>\n\u003c/svg>\u003c/div>\u003cdiv class=\"tip\">Сині числа — редагування · зелена риска — узгоджена довжина · H — над ЗПС · Vy — автоматично\u003c/div>\u003c/section>\n\n\n\u003cdetails>\u003csummary>Формули та позначення\u003c/summary>\u003cp>Виберіть МПР, КУР або обидва. МПР обчислюється від МКпос. КУР1 = (МКпос + 180°) mod 360. Інші точки: 240°, 270°, 240°, 285° + УС. У ручному режимі УС спільний. У режимі вітру УС, МК і W розраховуються для кожної ділянки: УС = asin(U·sin(δ−ПУ)/V), МК = ПУ−УС. V — TAS; W — шляхова швидкість. Напрямки магнітні. У вітрі 90° — зміна напрямку шляху; кут повороту носа та час розвороту враховують вітер. H1–H4 — над ЗПС; Vy = ΔH / t. Набір/зниження — за часом ділянок. Довжини узгоджуються автоматично для посадки в точку зльоту.\u003c/p>\u003c/details>\n\u003c/main>\n\u003cscript>(function(root){\n 'use strict';\n const G=9.80665,rad=Math.PI/180;\n const norm=a=>((a%360)+360)%360;\n function windSolution(tas,track,windTo,windSpeed){\n  if(!Number.isFinite(tas)||tas\u003c=0||!Number.isFinite(track)||!Number.isFinite(windTo)||!Number.isFinite(windSpeed)||windSpeed\u003c0)throw Error('Перевірте швидкості та напрямок вітру.');\n  const delta=(windTo-track)*rad,cross=windSpeed*Math.sin(delta),along=windSpeed*Math.cos(delta);\n  if(Math.abs(cross)>tas+1e-9)throw Error('Бічний вітер перевищує TAS: задану лінію шляху втримати неможливо.');\n  const drift=Math.asin(Math.max(-1,Math.min(1,cross/tas)))/rad,groundSpeed=Math.sqrt(Math.max(0,tas*tas-cross*cross))+along;\n  if(groundSpeed\u003c=1e-6)throw Error('На цій ділянці вітер не дозволяє рухатися вперед уздовж заданого шляху.');\n  return {drift,heading:norm(track-drift),groundSpeed,cross,along};\n }\n function turn(speed,bank){const v=speed/3.6,r=v*v/(G*Math.tan(bank*rad));return {r,t:Math.PI*r/(2*v),arc:Math.PI*r/2};}\n function build(config){\n  if(!config||!Array.isArray(config.legs)||config.legs.length!==7||!Array.isArray(config.turns)||config.turns.length!==4)throw Error('Потрібні сім ділянок і чотири розвороти.');\n  const positive=n=>Number.isFinite(n)&&n>0,direction=config.direction==='right'?-1:1;\n  if(!Number.isFinite(config.course)||config.course\u003c0||config.course>360)throw Error('Перевірте посадковий курс.');\n  config.legs.forEach(l=>{if(!Number.isFinite(l.s)||l.s\u003c0||!positive(l.w))throw Error('Перевірте довжини та швидкості ділянок.');});\n  config.turns.forEach(t=>{if(!positive(t.v)||!positive(t.b)||t.b>60||!Number.isFinite(t.h)||t.h\u003c0)throw Error('Перевірте швидкості, висоти та крен розворотів.');});\n  const wind=config.wind?.enabled?{enabled:true,direction:config.wind.direction,speed:config.wind.speed}:{enabled:false,direction:0,speed:0};\n  if(!Number.isFinite(wind.direction)||!Number.isFinite(wind.speed)||wind.speed\u003c0)throw Error('Перевірте напрямок та швидкість вітру.');\n  const windVector={x:wind.speed/3.6*Math.sin(wind.direction*rad),y:wind.speed/3.6*Math.cos(wind.direction*rad)};\n  const legDirections=[0,1,2,2,3,0,0];\n  const legs=config.legs.map((l,i)=>{const pu=norm(config.course-direction*90*legDirections[i]),tas=wind.enabled?(l.tas??l.w):l.w,solution=windSolution(tas,pu,wind.direction,wind.speed);return {...l,tas,pu,solution,w:solution.groundSpeed};});\n  const turns=config.turns.map((t,i)=>{\n   const v=t.v/3.6,r=turn(t.v,t.b).r,omega=direction*G*Math.tan(t.b*rad)/v;\n   const start=windSolution(t.v,norm(config.course-direction*90*i),wind.direction,wind.speed),finish=windSolution(t.v,norm(config.course-direction*90*(i+1)),wind.direction,wind.speed);\n   const airStart=Math.PI/2-start.heading*rad,airTarget=Math.PI/2-finish.heading*rad,delta=direction*((direction*(airTarget-airStart)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)),duration=delta/omega,airEnd=airStart+delta;\n   const dx=direction*r*(Math.sin(airEnd)-Math.sin(airStart))+windVector.x*duration,dy=direction*r*(Math.cos(airStart)-Math.cos(airEnd))+windVector.y*duration;\n   let sum=0;const bins=64;for(let j=0;j\u003c=bins;j++){const h=airStart+delta*j/bins,speed=Math.hypot(v*Math.cos(h)+windVector.x,v*Math.sin(h)+windVector.y);sum+=(j===0||j===bins?1:j%2?4:2)*speed;}\n   return {...t,r,t:duration,arc:sum*duration/(3*bins),airStart,omega,dx,dy};\n  });\n  const adjustments=[],issues=[];\n  function adjust(index,value){\n   if(!Number.isFinite(value)||value\u003c1){issues.push(`Для замикання ділянка «${legs[index].name}» має мати довжину ${Math.round(value)} м. Збільште розміри кола або зменште радіуси розворотів.`);return;}\n   if(Math.abs(legs[index].s-value)>.01)adjustments.push({index,name:legs[index].name,before:legs[index].s,after:value});\n   legs[index].s=value;\n  }\n  const initial=Math.PI/2-config.course*rad,sx=turns.reduce((s,t)=>s+t.dx,0),sy=turns.reduce((s,t)=>s+t.dy,0);\n  const rx=sx*Math.cos(initial)+sy*Math.sin(initial);\n  const ry=sx*Math.cos(initial+direction*Math.PI/2)+sy*Math.sin(initial+direction*Math.PI/2);\n  if(config.closureAnchor==='top')adjust(0,legs[2].s+legs[3].s-legs[5].s-legs[6].s-rx);\n  else{\n   const top=legs[0].s+legs[5].s+legs[6].s+rx,existing=legs[2].s+legs[3].s,ratio=existing>0?legs[2].s/existing:.5;\n   adjust(2,top*ratio);adjust(3,top*(1-ratio));\n  }\n  if(config.sideAnchor==='left')adjust(1,legs[4].s-ry);else adjust(4,legs[1].s+ry);\n  legs.forEach(l=>l.t=l.s/(l.w/3.6));\n  if(turns[1].h\u003cturns[0].h)issues.push('На ділянці 1 → 2 набір: H2 має бути не нижче H1.');\n  if(turns[3].h>turns[2].h)issues.push('На ділянці 3 → 4 зниження: H4 має бути не вище H3.');\n  const blocks=[{indices:[0],from:0,to:turns[0].h},{indices:[1],from:turns[0].h,to:turns[1].h},{indices:[2,3],from:turns[1].h,to:turns[2].h},{indices:[4],from:turns[2].h,to:turns[3].h},{indices:[5,6],from:turns[3].h,to:0}];\n  blocks.forEach(block=>{\n   block.duration=block.indices.reduce((s,i)=>s+legs[i].t,0);\n   block.vz=block.duration>0?(block.to-block.from)/block.duration:0;\n   block.rate=Math.abs(block.vz);\n   if(block.duration===0&&block.to!==block.from)issues.push(`${block.indices.map(i=>legs[i].name).join(' + ')}: для зміни висоти потрібна ненульова довжина ділянки.`);\n   let offset=0;block.indices.forEach(i=>{legs[i].block=block;legs[i].offset=offset;offset+=legs[i].t;});\n  });\n  const segments=[];let x=0,y=0,heading=Math.PI/2-config.course*rad,time=0,distance=0;\n  function addLeg(i){const l=legs[i];segments.push({type:'leg',index:i,name:l.name,start:time,duration:l.t,x,y,heading,airHeading:Math.PI/2-l.solution.heading*rad,speed:l.tas,groundSpeed:l.w,bank:0,block:l.block,offset:l.offset,distance:l.s});x+=Math.cos(heading)*l.s;y+=Math.sin(heading)*l.s;time+=l.t;distance+=l.s;}\n  function addTurn(i){const t=turns[i];segments.push({type:'turn',index:i,name:`${i+1}-й розворот`,start:time,duration:t.t,x,y,heading,airHeading:t.airStart,omega:t.omega,speed:t.v,bank:direction*t.b,r:t.r,altitude:t.h,distance:t.arc});x+=t.dx;y+=t.dy;heading+=direction*Math.PI/2;time+=t.t;distance+=t.arc;}\n  addLeg(0);addTurn(0);addLeg(1);addTurn(1);addLeg(2);addLeg(3);addTurn(2);addLeg(4);addTurn(3);addLeg(5);addLeg(6);\n  function sample(t){\n   t=Math.max(0,Math.min(time,t));const s=segments.find(s=>t\u003cs.start+s.duration-1e-8)||segments[segments.length-1];const dt=Math.min(s.duration,Math.max(0,t-s.start)),f=s.duration?dt/s.duration:1;\n   let px=s.x,py=s.y,h=s.airHeading,track=s.heading,groundSpeed=s.groundSpeed,z=0,vz=0;\n   if(s.type==='turn'){h+=s.omega*dt;px+=direction*s.r*(Math.sin(h)-Math.sin(s.airHeading))+windVector.x*dt;py+=direction*s.r*(Math.cos(s.airHeading)-Math.cos(h))+windVector.y*dt;z=s.altitude;const vx=s.speed/3.6*Math.cos(h)+windVector.x,vy=s.speed/3.6*Math.sin(h)+windVector.y;track=Math.atan2(vy,vx);groundSpeed=Math.hypot(vx,vy)*3.6;}\n   else{px+=Math.cos(track)*s.distance*f;py+=Math.sin(track)*s.distance*f;const b=s.block,bt=s.offset+dt;\n    const progress=b.duration?Math.max(0,Math.min(1,bt/b.duration)):1;\n    z=b.from+(b.to-b.from)*progress;vz=b.vz;\n   }\n   if(t>=time&&Math.hypot(x,y)\u003c1e-6){px=0;py=0;z=0;vz=0;}\n   const landed=t>=time&&Math.hypot(x,y)\u003c1e-6;\n   const course=norm(90-h/rad),trackCourse=norm(90-track/rad),drift=((trackCourse-course+540)%360)-180;\n   return {x:px,y:py,z,heading:h,track,course,trackCourse,drift,groundSpeed:landed?0:groundSpeed,speed:landed?0:s.speed,bank:landed?0:s.bank,vz,name:s.name,time:t,segment:s};\n  }\n  const points=[];for(let t=0;t\u003ctime;t+=Math.max(.5,time/1800))points.push(sample(t));points.push(sample(time));\n  const xs=points.map(p=>p.x),ys=points.map(p=>p.y),zs=points.map(p=>p.z);\n  const solvedConfig={...config,wind,legs:legs.map(l=>({name:l.name,s:l.s,w:l.w,tas:l.tas}))};\n  return {config:solvedConfig,legs,turns,segments,points,total:time,distance,issues,adjustments,closure:Math.hypot(x,y),end:{x,y},bounds:{minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys),maxZ:Math.max(...zs)},sample};\n }\n const api={build,turn,windSolution};if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.FlightModel=api;\n})(typeof globalThis!=='undefined'?globalThis:this);\n\u003c/script>\n\u003cscript>\nconst PANEL_DIRECTION='left';let suspendPublish=true;\nconst animationDocument=\"\\u003c!doctype html>\\n\\u003chtml lang=\\\"uk\\\">\\u003chead>\\u003cmeta charset=\\\"utf-8\\\">\\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\\u003ctitle>3D · Політ по колу\\u003c/title>\\n\\u003cstyle>\\n*{box-sizing:border-box}body{margin:0;background:#08131d;color:#dcecf5;font:14px 'Segoe UI',Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.top{position:absolute;top:22px;left:26px;right:26px;display:flex;al adjust(index,value){\\n   if(!Number.isFinite(value)||value\\u003c1){issues.push(`Для замикання ділянка «${legs[index].name}» має мати довжину ${Math.round(value)} м. Збільште розміри кола або зменште радіуси розворотів.`);return;}\\n   if(Math.abs(legs[index].s-value)>.01)adjustments.push({index,name:legs[index].name,before:legs[index].s,after:value});\\n   legs[index].s=value;\\n  }\\n  const initial=Math.PI/2-config.course*rad,sx=turns.reduce((s,t)=>s+t.dx,0),sy=turns.reduce((s,t)=>s+t.dy,0);\\n  const rx=sx*Math.cos(initial)+sy*Math.sin(initial);\\n  const ry=sx*Math.cos(initial+direction*Math.PI/2)+sy*Math.sin(initial+direction*Math.PI/2);\\n  if(config.closureAnchor==='top')adjust(0,legs[2].s+legs[3].s-legs[5].s-legs[6].s-rx);\\n  else{\\n   const top=legs[0].s+legs[5].s+legs[6].s+rx,existing=legs[2].s+legs[3].s,ratio=existing>0?legs[2].s/existing:.5;\\n   adjust(2,top*ratio);adjust(3,top*(1-ratio));\\n  }\\n  if(config.sideAnchor==='left')adjust(1,legs[4].s-ry);else adjust(4,legs[1].s+ry);\\n  legs.forEach(l=>l.t=l.s/(l.w/3.6));\\n  if(turns[1].h\\u003cturns[0].h)issues.push('На ділянці 1 → 2 набір: H2 має бути не нижче H1.');\\n  if(turns[3].h>turns[2].h)issues.push('На ділянці 3 → 4 зниження: H4 має бути не вище H3.');\\n  const blocks=[{indices:[0],from:0,to:turns[0].h},{indices:[1],from:turns[0].h,to:turns[1].h},{indices:[2,3],from:turns[1].h,to:turns[2].h},{indices:[4],from:turns[2].h,to:turns[3].h},{indices:[5,6],from:turns[3].h,to:0}];\\n  blocks.forEach(block=>{\\n   block.duration=block.indices.reduce((s,i)=>s+legs[i].t,0);\\n   block.vz=block.duration>0?(block.to-block.from)/block.duration:0;\\n   block.rate=Math.abs(block.vz);\\n   if(block.duration===0&&block.to!==block.from)issues.push(`${block.indices.map(i=>legs[i].name).join(' + ')}: для зміни висоти потрібна ненульова довжина ділянки.`);\\n   let offset=0;block.indices.forEach(i=>{legs[i].block=block;legs[i].offset=offset;offset+=legs[i].t;});\\n  });\\n  const segments=[];let x=0,y=0,heading=Math.PI/2-config.course*rad,time=0,distance=0;\\n  function addLeg(i){const l=legs[i];segments.push({type:'leg',index:i,name:l.name,start:time,duration:l.t,x,y,heading,airHeading:Math.PI/2-l.solution.heading*rad,speed:l.tas,groundSpeed:l.w,bank:0,block:l.block,offset:l.offset,distance:l.s});x+=Math.cos(heading)*l.s;y+=Math.sin(heading)*l.s;time+=l.t;distance+=l.s;}\\n  function addTurn(i){const t=turns[i];segments.push({type:'turn',index:i,name:`${i+1}-й розворот`,start:time,duration:t.t,x,y,heading,airHeading:t.airStart,omega:t.omega,speed:t.v,bank:direction*t.b,r:t.r,altitude:t.h,distance:t.arc});x+=t.dx;y+=t.dy;heading+=direction*Math.PI/2;time+=t.t;distance+=t.arc;}\\n  addLeg(0);addTurn(0);addLeg(1);addTurn(1);addLeg(2);addLeg(3);addTurn(2);addLeg(4);addTurn(3);addLeg(5);addLeg(6);\\n  function sample(t){\\n   t=Math.max(0,Math.min(time,t));const s=segments.find(s=>t\\u003cs.start+s.duration-1e-8)||segments[segments.length-1];const dt=Math.min(s.duration,Math.max(0,t-s.start)),f=s.duration?dt/s.duration:1;\\n   let px=s.x,py=s.y,h=s.airHeading,track=s.heading,groundSpeed=s.groundSpeed,z=0,vz=0;\\n   if(s.type==='turn'){h+=s.omega*dt;px+=direction*s.r*(Math.sin(h)-Math.sin(s.airHeading))+windVector.x*dt;py+=direction*s.r*(Math.cos(s.airHeading)-Math.cos(h))+windVector.y*dt;z=s.altitude;const vx=s.speed/3.6*Math.cos(h)+windVector.x,vy=s.speed/3.6*Math.sin(h)+windVector.y;track=Math.atan2(vy,vx);groundSpeed=Math.hypot(vx,vy)*3.6;}\\n   else{px+=Math.cos(track)*s.distance*f;py+=Math.sin(track)*s.distance*f;const b=s.block,bt=s.offset+dt;\\n    const progress=b.duration?Math.max(0,Math.min(1,bt/b.duration)):1;\\n    z=b.from+(b.to-b.from)*progress;vz=b.vz;\\n   }\\n   if(t>=time&&Math.hypot(x,y)\\u003c1e-6){px=0;py=0;z=0;vz=0;}\\n   const landed=t>=time&&Math.hypot(x,y)\\u003c1e-6;\\n   const course=norm(90-h/rad),trackCourse=norm(90-track/rad),drift=((trackCourse-course+540)%360)-180;\\n   return {x:px,y:py,z,heading:h,track,course,trackCourse,drift,groundSpeed:landed?0:groundSpeed,speed:landed?0:s.speed,bank:landed?0:s.bank,vz,name:s.name,time:t,segment:s};\\n  }\\n  const points=[];for(let t=0;t\\u003ctime;t+=Math.max(.5,time/1800))points.push(sample(t));points.push(sample(time));\\n  const xs=points.map(p=>p.x),ys=points.map(p=>p.y),zs=points.map(p=>p.z);\\n  const solvedConfig={...config,wind,legs:legs.map(l=>({name:l.name,s:l.s,w:l.w,tas:l.tas}))};\\n  return {config:solvedConfig,legs,turns,segments,points,total:time,distance,issues,adjustments,closure:Math.hypot(x,y),end:{x,y},bounds:{minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys),maxZ:Math.max(...zs)},sample};\\n }\\n const api={build,turn,windSolution};if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.FlightModel=api;\\n})(typeof globalThis!=='undefined'?globalThis:this);\\n\\u003c/script>\\n\\u003cscript>\\nconst $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');\\nlet plan;\\ntry{if(!location.hash.slice(1))throw Error('Відкрийте circuit.html, задайте параметри та натисніть «3D-політ».');plan=FlightModel.build(JSON.parse(decodeURIComponent(location.hash.slice(1))));if(plan.issues.length)throw Error(plan.issues.join('\\\\n'));}\\ncatch(error){$('error').hidden=false;$('error').textContent=error.message;}\\nif(plan){\\n $('circuitTitle').textContent=plan.config.direction==='right'?'Праве коло':'Ліве коло';\\n document.title=(plan.config.direction==='right'?'Праве':'Ліве')+' коло · 3D';\\n const bounds=plan.bounds,center={x:(bounds.minX+bounds.maxX)/2,y:(bounds.minY+bounds.maxY)/2,z:bounds.maxZ/3},extent=Math.max(bounds.maxX-bounds.minX,bounds.maxY-bounds.minY,1000),modelScale=Math.max(18,extent/125);\\n const units=plan.config.units||{},fmt=t=>`${Math.floor(Math.round(t)/60)}:${String(Math.round(t)%60).padStart(2,'0')}`;\\n let w=1,h=1,time=0,last=null,playing=true,yaw=-.7,pitch=.76,zoom=1,top=false,drag=null;\\n let camera,forward,right,up,focal;\\n const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),norm=a=>{const n=Math.hypot(a.x,a.y,a.z);return{x:a.x/n,y:a.y/n,z:a.z/n};};\\n function setupCamera(){const distance=extent*1.55/zoom;camera={x:center.x+Math.cos(yaw)*Math.cos(pitch)*distance,y:center.y+Math.sin(yaw)*Math.cos(pitch)*distance,z:center.z+Math.sin(pitch)*distance};forward=norm(sub(center,camera));right=norm(cross(forward,{x:0,y:0,z:1}));up=cross(right,forward);focal=Math.min(w,h)*1.12;}\\n function project(p){const v=sub(p,camera),depth=dot(v,forward);if(depth\\u003c=1)return null;return{x:w*.54+dot(v,right)*focal/depth,y:h*.46-dot(v,up)*focal/depth,depth};}\\n function line(points,color,width=1,dash=[]){ctx.beginPath();let started=false;for(const p of points){const q=project(p);if(!q){started=false;continue;}if(!started){ctx.moveTo(q.x,q.y);started=true;}else ctx.lineTo(q.x,q.y);}ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);}\\n function polygon(points,color,stroke){const ps=points.map(project);if(ps.some(p=>!p))return;ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}\\n function label(p,text,color='#99b8cb'){const q=project(p);if(!q)return;ctx.font='12px Segoe UI, sans-serif';const tw=ctx.measureText(text).width;ctx.fillStyle='#0a1a24cc';ctx.fillRect(q.x-5,q.y-16,tw+10,21);ctx.fillStyle=color;ctx.fillText(text,q.x,q.y);}\\n const turnStarts=plan.segments.filter(s=>s.type==='turn').map(s=>plan.sample(s.start));\\n const beaconLeg=plan.segments.find(s=>s.type==='leg'&&s.index===6),beacon={x:beaconLeg.x,y:beaconLeg.y,z:0};\\n $('timeline').max=String(plan.total);\\n $('notice').textContent=plan.config.wind?.enabled?'Ніс повернутий проти зносу. Шляхова швидкість і розвороти розраховані з вектором вітру; курс носа відрізняється від лінії шляху. Зліт і посадка — одна точка ЗПС.':'Зліт і посадка — одна точка ЗПС. Ручний УС змінює навігаційні підписи; для демонстрації вітру виберіть «За вітром».';\\n function resize(){const ratio=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);}\\n addEventListener('resize',resize);resize();\\n function helicopter(state,now){\\n  const size=modelScale,roll=-state.bank*Math.PI/180,pitchAngle=Math.atan2(state.vz,state.speed/3.6);\\n  function local(x,y,z){let px=x*Math.cos(pitchAngle)-z*Math.sin(pitchAngle),pz=x*Math.sin(pitchAngle)+z*Math.cos(pitchAngle),py=y*Math.cos(roll)-pz*Math.sin(roll);pz=y*Math.sin(roll)+pz*Math.cos(roll);return{x:state.x+(px*Math.cos(state.heading)-py*Math.sin(state.heading))*size,y:state.y+(px*Math.sin(state.heading)+py*Math.cos(state.heading))*size,z:state.z+(pz+.5)*size};}\\n  const vertices=[[1.05,0,0],[.45,-.43,-.22],[-.62,-.35,-.2],[-.82,0,.15],[-.62,.35,-.2],[.45,.43,-.22],[.55,-.31,.42],[.55,.31,.42],[-.48,0,.5]].map(v=>local(...v));\\n  const faces=[{i:[0,1,6],c:'#bceafa'},{i:[0,7,5],c:'#8dc8df'},{i:[6,7,0],c:'#d7f5ff'},{i:[1,2,8,6],c:'#27658a'},{i:[5,7,8,4],c:'#3986a6'},{i:[2,3,4,8],c:'#1a4669'},{i:[6,8,7],c:'#65b6d1'}];\\n  faces.filter(f=>f.i.every(i=>project(vertices[i]))).sort((a,b)=>b.i.reduce((s,i)=>s+project(vertices[i]).depth,0)/b.i.length-a.i.reduce((s,i)=>s+project(vertices[i]).depth,0)/a.i.length).forEach(f=>polygon(f.i.map(i=>vertices[i]),f.c,'#a2def33a'));\\n  line([local(-.6,0,.05),local(-2.25,0,.25)],'#63a9c9',4);line([local(-2.25,-.45,.25),local(-2.25,.45,.25)],'#b3dfed',2);\\n  [-.48,.48].forEach(y=>{line([local(-.65,y,-.48),local(.75,y,-.48)],'#d3e7ef',2);line([local(-.35,y,-.48),local(-.35,y*.6,-.12)],'#91bdcf',1.5);});\\n  line([local(0,0,.3),local(0,0,.9)],'#bdd7e4',2);\\n  const rotor=now*.028;for(let a=0;a\\u003c2;a++){const r=rotor+a*Math.PI/2;line([local(-2.3*Math.cos(r),-2.3*Math.sin(r),.92),loca 3M0-9V1\" fill=\"none\" stroke-width=\"2.4\"/>\n\u003ccircle cy=\"-4\" r=\"2.5\" fill=\"white\" stroke-width=\"1.3\"/>\n\u003c/g>\u003c/g>\u003c/defs>\n\u003cstyle>\n.card{fill:white;stroke:#cfdee6;stroke-width:1}.card-title{font-weight:600!important}.value{fill:#155a73!important}svg[data-theme=\"dark\"] .value{fill:#b8e2f2!important}.card-title{font:11px Arial,sans-serif;fill:#6f8795;letter-spacing:1.2px}.value{font:18px Consolas,monospace;fill:#183746}.small{font:12px Arial,sans-serif;fill:#6f8795}.result{font:15px Consolas,monospace;fill:#183746}.dim{stroke:#91adbc;stroke-width:1;fill:none}.connect{stroke:#b3c9d4;stroke-width:1;fill:none;stroke-dasharray:3 4}.editline{display:flex;align-items:center;gap:5px;height:29px;font:13px Arial,sans-serif;color:#6f8795;white-space:nowrap}.editline label{display:flex;align-items:center;gap:6px}.editline input{font:18px Consolas,monospace;color:#216d93;background:#f1f8fb;border:0;border-bottom:1px dashed #71a4be;border-radius:2px;width:73px;height:28px;padding:2px 4px;outline-offset:1px;box-sizing:border-box}.editline input:focus{outline:2px solid #72b1d0;background:#e7f5fc}.editline input[aria-invalid=true]{background:#fff0eb;outline:1px solid #bd5535}.editline input::-webkit-inner-spin-button{opacity:.35}.distance .editline{height:36px;padding:3px 7px;background:#fff;border:1px solid #cbdde6;border-radius:5px}.distance .editline input{width:84px}.editline input.narrow{width:55px}.editline input.course{width:110px;height:43px;font-size:34px}.editline.big{height:46px;justify-content:center}.editline.big label{font-size:15px}.editline span.unit{font-size:11px} @media print{.editline input{background:white;border-bottom:none;color:#216d93;appearance:textfield}.editline input::-webkit-inner-spin-button{display:none}}\nsvg[data-theme=\"dark\"] rect[fill=\"white\"],svg[data-theme=\"dark\"] .card{fill:#132936;stroke:#365363}svg[data-theme=\"dark\"] rect[fill=\"#f8fbfc\"]{fill:#102430}svg[data-theme=\"dark\"] rect[stroke=\"#e0ebf0\"]{stroke:#233c4b}svg[data-theme=\"dark\"] #grid path{stroke:#284351}svg[data-theme=\"dark\"] #routeSegments{stroke:#7babc4}svg[data-theme=\"dark\"] .card-title,svg[data-theme=\"dark\"] .small,svg[data-theme=\"dark\"] #dimensions{fill:#9cb6c5}svg[data-theme=\"dark\"] .value,svg[data-theme=\"dark\"] .result{fill:#deedf5}svg[data-theme=\"dark\"] .editline{color:#a8c4d4}svg[data-theme=\"dark\"] .editline input{color:#95d5f4;background:#213e50;border-color:#6093ae}svg[data-theme=\"dark\"] .editline input[aria-invalid=\"true\"]{background:#573128}svg[data-theme=\"dark\"] #helicopter>circle:first-child{fill:#1c3545;stroke:#537387}svg[data-theme=\"dark\"] .dim,svg[data-theme=\"dark\"] .connect{stroke:#557789}svg[data-theme=\"dark\"] .distance .editline{background:#132936;border-color:#365363}\n\u003c/style>\n\u003cg transform=\"translate(1600 0) scale(-1 1)\">\u003crect width=\"1600\" height=\"980\" fill=\"white\"/>\u003crect x=\"20\" y=\"20\" width=\"1560\" height=\"940\" fill=\"url(#grid)\"/>\n\u003crect x=\"350\" y=\"260\" width=\"900\" height=\"500\" rx=\"85\" fill=\"#f8fbfc\"/>\n\u003crect x=\"350\" y=\"260\" width=\"900\" height=\"500\" rx=\"85\" fill=\"none\" stroke=\"#e0ebf0\" stroke-width=\"20\"/>\n\u003cg id=\"routeSegments\" fill=\"none\" stroke=\"#315e75\" stroke-width=\"3\" stroke-linecap=\"round\">\n\u003cpath id=\"routeLeg0\" d=\"M950 760H1165\"/>\u003cpath d=\"M1165 760Q1250 760 1250 675\"/>\n\u003cpath id=\"routeLeg1\" d=\"M1250 675V345\"/>\u003cpath d=\"M1250 345Q1250 260 1165 260\"/>\n\u003cpath id=\"routeLeg2\" d=\"M1165 260H700\"/>\u003cpath id=\"routeLeg3\" d=\"M700 260H435\"/>\n\u003cpath d=\"M435 260Q350 260 350 345\"/>\u003cpath id=\"routeLeg4\" d=\"M350 345V675\"/>\n\u003cpath d=\"M350 675Q350 760 435 760\"/>\u003cpath id=\"routeLeg5\" d=\"M435 760H700\"/>\n\u003cpath id=\"routeLeg6\" d=\"M700 760H950\"/>\n\u003c/g>\n\u003cg stroke=\"#90aebb\" stroke-width=\"1.4\" stroke-dasharray=\"7 7\" fill=\"none\">\u003cpath d=\"M1250 700L700 760M1230 285L700 760M700 260V760M410 265L700 760M350 690L700 760\"/>\u003c/g>\n\u003cg class=\"dim\">\u003cpath d=\"M950 830L1165 830\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M1280 345L1280 675\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M700 235L1165 235\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M435 235L700 235\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M320 345L320 675\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M435 830L700 830\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003cpath d=\"M700 830L950 830\" marker-start=\"url(#dimensionArrow)\" marker-end=\"url(#dimensionArrow)\"/>\u003c/g>\n\u003cg fill=\"none\" stroke=\"#315e75\" stroke-width=\"2\" marker-end=\"url(#arrow)\">\u003cpath d=\"M1080 760H1120M1250 590V550M1050 260H1010M350 430V470M490 760H530\"/>\u003c/g>\n\u003cg id=\"dimensions\" font-family=\"Consolas,monospace\" font-size=\"12\" fill=\"#6e8998\" text-anchor=\"middle\">\u003c/g>\n\u003cg fill=\"white\" stroke=\"#357c9e\" stroke-width=\"2\">\u003ccircle cx=\"1250\" cy=\"700\" r=\"5\"/>\u003ccircle cx=\"1230\" cy=\"285\" r=\"5\"/>\u003ccircle cx=\"700\" cy=\"260\" r=\"5\"/>\u003ccircle cx=\"410\" cy=\"265\" r=\"5\"/>\u003ccircle cx=\"350\" cy=\"690\" r=\"5\"/>\u003c/g>\n\u003cg filter=\"url(#heliShadow)\">\u003cuse href=\"#helicopter\" transform=\"translate(1100 760) rotate(90)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(1250 470)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(980 260) rotate(-90)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(350 520) rotate(180)\"/>\u003cuse href=\"#helicopter\" transform=\"translate(565 760) rotate(90)\"/>\u003c/g>\n\u003cg font-family=\"Arial,sans-serif\">\u003crect x=\"860\" y=\"739\" width=\"180\" height=\"42\" rx=\"4\" fill=\"#29495b\"/>\u003cpath d=\"M883 760H1017\" stroke=\"white\" stroke-width=\"1.5\" stroke-dasharray=\"15 10\"/>\u003cpath d=\"M868 745V775M873 745V775M1027 745V775M1032 745V775\" stroke=\"white\" stroke-width=\"2\"/>\u003ctext transform=\"translate(1900 0) scale(-1 1)\" x=\"950\" y=\"805\" text-anchor=\"middle\" class=\"card-title\">ЗПС\u003c/text>\n\u003cpath d=\"M700 735L680 778H720Z\" fill=\"#226c94\" stroke=\"white\" stroke-width=\"2\"/>\u003cpath d=\"M687 727Q676 714 684 703M713 727Q724 714 716 703\" fill=\"none\" stroke=\"#226c94\" stroke-width=\"2\"/>\u003ctext transform=\"translate(1400 0) scale(-1 1)\" x=\"700\" y=\"798\" text-anchor=\"middle\" class=\"card-title\">РАДІОМАЯК\u003c/text>\u003c/g>\n\u003c/g>\u003cg id=\"editors\">\u003c/g>\n\u003cg font-family=\"Arial,sans-serif\">\u003cg transform=\"translate(-1260 0)\">\n\u003crect x=\"1300\" y=\"490\" width=\"260\" height=\"155\" rx=\"7\" class=\"card\"/>\n\u003crect x=\"1300\" y=\"490\" width=\"4\" height=\"155\" rx=\"2\" fill=\"#4389ae\"/>\n\u003ctext x=\"1316\" y=\"515\" class=\"card-title\">ЧАС КОЛА · ХВ:С\u003c/text>\n\u003ctext id=\"flightTotal\" x=\"1316\" y=\"558\" class=\"value\" style=\"font-size:36px;font-weight:600\">—\u003c/text>\n\u003ctext x=\"1316\" y=\"583\" class=\"small\">Прямі / розвороти\u003c/text>\u003ctext id=\"timeParts\" x=\"1316\" y=\"605\" class=\"result\">—\u003c/text>\n\u003ctext x=\"1316\" y=\"630\" class=\"small\">Довжина\u003c/text>\u003ctext id=\"distanceTotal\" x=\"1544\" y=\"630\" text-anchor=\"end\" class=\"result\">—\u003c/text>\n\u003c/g>\u003ctext id=\"error\" x=\"800\" y=\"978\" text-anchor=\"middle\" fill=\"#b24932\" font-size=\"12\" role=\"status\">\u003c/text>\n\u003ctext x=\"40\" y=\"960\" class=\"small\">S — м · W/TAS — швидкість · H — висота · γ — крен · Vy — вертикальна швидкість\u003c/text>\u003ctext x=\"1560\" y=\"960\" text-anchor=\"end\" class=\"small\">НАВЧАЛЬНА СХЕМА · БЕЗ МАСШТАБУ\u003c/text>\u003c/g>\n\u003c/svg>\u003c/div>\u003cdiv class=\"tip\">Сині числа — редагування · зелена риска — узгоджена довжина · H — над ЗПС · Vy — автоматично\u003c/div>\u003c/section>\n\n\n\u003cdetails>\u003csummary>Формули та позначення\u003c/summary>\u003cp>Виберіть МПР, КУР або обидва. МПР обчислюється від МКпос. КУР1 = (МКпос + 180°) mod 360. Інші точки: 120°, 90°, 120°, 75° + УС. У ручному режимі УС спільний. У режимі вітру УС, МК і W розраховуються для кожної ділянки: УС = asin(U·sin(δ−ПУ)/V), МК = ПУ−УС. V — TAS; W — шляхова швидкість. Напрямки магнітні. У вітрі 90° — зміна напрямку шляху; кут повороту носа та час розвороту враховують вітер. H1–H4 — над ЗПС; Vy = ΔH / t. Набір/зниження — за часом ділянок. Довжини узгоджуються автоматично для посадки в точку зльоту.\u003c/p>\u003c/details>\n\u003c/main>\n\u003cscript>(function(root){\n 'use strict';\n const G=9.80665,rad=Math.PI/180;\n const norm=a=>((a%360)+360)%360;\n function windSolution(tas,track,windTo,windSpeed){\n  if(!Number.isFinite(tas)||tas\u003c=0||!Number.isFinite(track)||!Number.isFinite(windTo)||!Number.isFinite(windSpeed)||windSpeed\u003c0)throw Error('Перевірте швидкості та напрямок вітру.');\n  const delta=(windTo-track)*rad,cross=windSpeed*Math.sin(delta),along=windSpeed*Math.cos(delta);\n  if(Math.abs(cross)>tas+1e-9)throw Error('Бічний вітер перевищує TAS: задану лінію шляху втримати неможливо.');\n  const drift=Math.asin(Math.max(-1,Math.min(1,cross/tas)))/rad,groundSpeed=Math.sqrt(Math.max(0,tas*tas-cross*cross))+along;\n  if(groundSpeed\u003c=1e-6)throw Error('На цій ділянці вітер не дозволяє рухатися вперед уздовж заданого шляху.');\n  return {drift,heading:norm(track-drift),groundSpeed,cross,along};\n }\n function turn(speed,bank){const v=speed/3.6,r=v*v/(G*Math.tan(bank*rad));return {r,t:Math.PI*r/(2*v),arc:Math.PI*r/2};}\n function build(config){\n  if(!config||!Array.isArray(config.legs)||config.legs.length!==7||!Array.isArray(config.turns)||config.turns.length!==4)throw Error('Потрібні сім ділянок і чотири розвороти.');\n  const positive=n=>Number.isFinite(n)&&n>0,direction=config.direction==='right'?-1:1;\n  if(!Number.isFinite(config.course)||config.course\u003c0||config.course>360)throw Error('Перевірте посадковий курс.');\n  config.legs.forEach(l=>{if(!Number.isFinite(l.s)||l.s\u003c0||!positive(l.w))throw Error('Перевірте довжини та швидкості ділянок.');});\n  config.turns.forEach(t=>{if(!positive(t.v)||!positive(t.b)||t.b>60||!Number.isFinite(t.h)||t.h\u003c0)throw Error('Перевірте швидкості, висоти та крен розворотів.');});\n  const wind=config.wind?.enabled?{enabled:true,direction:config.wind.direction,speed:config.wind.speed}:{enabled:false,direction:0,speed:0};\n  if(!Number.isFinite(wind.direction)||!Number.isFinite(wind.speed)||wind.speed\u003c0)throw Error('Перевірте напрямок та швидкість вітру.');\n  const windVector={x:wind.speed/3.6*Math.sin(wind.direction*rad),y:wind.speed/3.6*Math.cos(wind.direction*rad)};\n  const legDirections=[0,1,2,2,3,0,0];\n  const legs=config.legs.map((l,i)=>{const pu=norm(config.course-direction*90*legDirections[i]),tas=wind.enabled?(l.tas??l.w):l.w,solution=windSolution(tas,pu,wind.direction,wind.speed);return {...l,tas,pu,solution,w:solution.groundSpeed};});\n  const turns=config.turns.map((t,i)=>{\n   const v=t.v/3.6,r=turn(t.v,t.b).r,omega=direction*G*Math.tan(t.b*rad)/v;\n   const start=windSolution(t.v,norm(config.course-direction*90*i),wind.direction,wind.speed),finish=windSolution(t.v,norm(config.course-direction*90*(i+1)),wind.direction,wind.speed);\n   const airStart=Math.PI/2-start.heading*rad,airTarget=Math.PI/2-finish.heading*rad,delta=direction*((direction*(airTarget-airStart)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)),duration=delta/omega,airEnd=airStart+delta;\n   const dx=direction*r*(Math.sin(airEnd)-Math.sin(airStart))+windVector.x*duration,dy=direction*r*(Math.cos(airStart)-Math.cos(airEnd))+windVector.y*duration;\n   let sum=0;const bins=64;for(let j=0;j\u003c=bins;j++){const h=airStart+delta*j/bins,speed=Math.hypot(v*Math.cos(h)+windVector.x,v*Math.sin(h)+windVector.y);sum+=(j===0||j===bins?1:j%2?4:2)*speed;}\n   return {...t,r,t:duration,arc:sum*duration/(3*bins),airStart,omega,dx,dy};\n  });\n  const adjustments=[],issues=[];\n  function adjust(index,value){\n   if(!Number.isFinite(value)||value\u003c1){issues.push(`Для замикання ділянка «${legs[index].name}» має мати довжину ${Math.round(value)} м. Збільште розміри кола або зменште радіуси розворотів.`);return;}\n   if(Math.abs(legs[index].s-value)>.01)adjustments.push({index,name:legs[index].name,before:legs[index].s,after:value});\n   legs[index].s=value;\n  }\n  const initial=Math.PI/2-config.course*rad,sx=turns.reduce((s,t)=>s+t.dx,0),sy=turns.reduce((s,t)=>s+t.dy,0);\n  const rx=sx*Math.cos(initial)+sy*Math.sin(initial);\n  const ry=sx*Math.cos(initial+direction*Math.PI/2)+sy*Math.sin(initial+direction*Math.PI/2);\n  if(config.closureAnchor==='top')adjust(0,legs[2].s+legs[3].s-legs[5].s-legs[6].s-rx);\n  else{\n   const top=legs[0].s+legs[5].s+legs[6].s+rx,existing=legs[2].s+legs[3].s,ratio=existing>0?legs[2].s/existing:.5;\n   adjust(2,top*ratio);adjust(3,top*(1-ratio));\n  }\n  if(config.sideAnchor==='left')adjust(1,legs[4].s-ry);else adjust(4,legs[1].s+ry);\n  legs.forEach(l=>l.t=l.s/(l.w/3.6));\n  if(turns[1].h\u003cturns[0].h)issues.push('На ділянці 1 → 2 набір: H2 має бути не нижче H1.');\n  if(turns[3].h>turns[2].h)issues.push('На ділянці 3 → 4 зниження: H4 має бути не вище H3.');\n  const blocks=[{indices:[0],from:0,to:turns[0].h},{indices:[1],from:turns[0].h,to:turns[1].h},{indices:[2,3],from:turns[1].h,to:turns[2].h},{indices:[4],from:turns[2].h,to:turns[3].h},{indices:[5,6],from:turns[3].h,to:0}];\n  blocks.forEach(block=>{\n   block.duration=block.indices.reduce((s,i)=>s+legs[i].t,0);\n   block.vz=block.duration>0?(block.to-block.from)/block.duration:0;\n   block.rate=Math.abs(block.vz);\n   if(block.duration===0&&block.to!==block.from)issues.push(`${block.indices.map(i=>legs[i].name).join(' + ')}: для зміни висоти потрібна ненульова довжин function updateButtons(){ $('saveLeft').disabled=!valid.left;$('saveRight').disabled=!valid.right;$('saveBoth').disabled=!valid.left||!valid.right; }
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,states,theme:dark?'dark':'light'}));storageOK=true;$('autoStatus').textContent='Автозбережено · '+new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});}catch{storageOK=false;$('autoStatus').textContent='Автозбереження недоступне. Збережіть JSON-файл.';}}
try{const cached=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(cached&&cached.version===1){for(const d of directions)if(cached.states?.[d])states[d]=validateState(cached.states[d],d,true);dark=cached.theme==='dark';}else dark=localStorage.getItem('circuit-theme')==='dark';}catch{$('autoStatus').textContent='Налаштування недоступні. Відкрийте JSON-файл.';}
function setTheme(value){dark=value;document.body.dataset.theme=dark?'dark':'light';$('theme').innerHTML=dark?"<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5\"/></svg>Світла":"<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z\"/></svg>Темна";$('theme').setAttribute('aria-pressed',String(dark));for(const d of directions)frames[d].contentWindow?.postMessage({type:'set-theme',dark},'*');}
function downloadSettings(which){const selected=which==='both'?directions:[which];if(selected.some(d=>!valid[d])){$('fileStatus').textContent='Спочатку виправте виділені числа.';return;}const circuits={};for(const d of selected)circuits[d]=validateState(states[d],d);const payload={format:'flight-circuit-settings',version:1,savedAt:new Date().toISOString(),circuits};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flight-'+which+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('fileStatus').textContent=which==='both'?'Збережено обидві схеми.':which==='left'?'Ліве коло збережено.':'Праве коло збережено.';}

window.addEventListener('message',event=>{
 const direction=directions.find(d=>frames[d].contentWindow===event.source);if(!direction||event.data?.direction!==direction)return;const msg=event.data;
 if(msg.type==='circuit-ready'){frames[direction].contentWindow.postMessage({type:'set-theme',dark},'*');if(states[direction])frames[direction].contentWindow.postMessage({type:'restore-circuit',state:states[direction]},'*');else{restoring[direction]=false;frames[direction].contentWindow.postMessage({type:'request-state'},'*');}}
